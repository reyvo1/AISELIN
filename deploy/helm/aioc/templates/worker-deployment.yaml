apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-aioc-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: aioc, app.kubernetes.io/component: worker}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 1, maxSurge: 1}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aioc, app.kubernetes.io/component: worker}}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python","-m","app.worker"]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-aioc}
            - secretRef: {name: {{ .Values.secret.existingSecret }}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
