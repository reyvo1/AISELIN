apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-aioc-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app.kubernetes.io/name: aioc, app.kubernetes.io/component: api}}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    metadata: {labels: {app.kubernetes.io/name: aioc, app.kubernetes.io/component: api}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-aioc}
            - secretRef: {name: {{ .Values.secret.existingSecret }}}
          readinessProbe: {httpGet: {path: /api/v1/health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/v1/health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 20}
          resources: {{- toYaml .Values.resources | nindent 12 }}
